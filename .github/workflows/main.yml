name: Build Trade-time APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

       - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          mapfile -t settings < <(
            find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*'
          )

          if [ "${#settings[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one extracted Android project. Upload ZIP contents and remove duplicate project copies."
            exit 1
          fi

          project_dir="$(dirname "${settings[0]}")"
          echo "directory=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-time-v1.3-debug
          path: ${{ steps.project.outputs.directory }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
